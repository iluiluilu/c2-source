# Vietnamese messages for the AISmartStore login theme.
# `vi` is not shipped with Keycloak, so keys we surface must be defined here;
# anything missing falls back to the English (base) bundle.
# UTF-8; Keycloak reads login message bundles as UTF-8.

loginTitle=Đăng nhập {0}
loginTitleHtml={0}

doLogIn=Đăng nhập
doForgotPassword=Quên mật khẩu?
doTryAnotherWay=Thử cách khác
doCancel=Hủy

username=Tên đăng nhập
usernameOrEmail=Tên đăng nhập hoặc email
email=Email
password=Mật khẩu
rememberMe=Ghi nhớ đăng nhập

loginAccountTitle=Đăng nhập hệ thống
noAccount=Chưa có tài khoản?
doRegister=Đăng ký

