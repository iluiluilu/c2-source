# export-reporting T11 (SPEC Part T §4): fail early when a font is missing instead of silently
# substituting one that has no Vietnamese glyphs (AC-26).
net.sf.jasperreports.awt.ignore.missing.font=false
net.sf.jasperreports.default.font.name=AISS Sans
net.sf.jasperreports.default.pdf.font.name=AISS Sans
net.sf.jasperreports.default.pdf.encoding=Identity-H
net.sf.jasperreports.default.pdf.embedded=true
# Never evaluate anything coming from input at fill time; templates are closed and precompiled.
net.sf.jasperreports.compiler.keep.java.file=false
