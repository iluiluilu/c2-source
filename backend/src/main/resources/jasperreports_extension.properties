# export-reporting T11: register the committed fonts (src/main/resources/fonts) with Jasper so PDF output embeds them
# and does not depend on fonts installed on the host (AC-26).
net.sf.jasperreports.extension.registry.factory.simple.font.families=net.sf.jasperreports.engine.fonts.SimpleFontExtensionsRegistryFactory
net.sf.jasperreports.extension.simple.font.families.aismartstore=fonts/fonts.xml
