# clamd configuration for the AISmartStore ingest pipeline (FR-12).
# Mounted over the clamav/clamav image's default /etc/clamav/clamd.conf.
#
# The stream limits below are raised from clamd's 25MB default: FR-11 accepts
# audio/video up to MAX_UPLOAD_BYTES (2GB), and anything above StreamMaxLength
# would be silently truncated/errored instead of scanned.

LogTime yes
LogVerbose no
ExtendedDetectionInfo yes

# Listen on TCP for the backend container (INSTREAM protocol).
TCPSocket 3310
TCPAddr 0.0.0.0

Foreground yes

# Match MAX_UPLOAD_BYTES (2 GiB) in the backend service env.
StreamMaxLength 2000M
MaxFileSize 2000M
MaxScanSize 2000M

# Reasonable dev defaults; tune for prod hardware at deployment (GD4).
MaxThreads 4
ReadTimeout 300
