# auth.green0tech.site -> keycloak (port 8080)
#
# Duong ra ngoai duy nhat cho Keycloak. backend/web cung goi Keycloak qua
# chinh domain nay (alias mang noi bo tro AUTH_DOMAIN vao service nginx, xem
# docker-compose.yml) chu KHONG goi thang service keycloak, de `iss` trong
# token luon la http://auth.green0tech.site - khop voi URL browser dung khi
# dang nhap.
server {
    listen 80;
    server_name auth.green0tech.site;

    location / {
        set $upstream_keycloak keycloak:8080;
        proxy_pass http://$upstream_keycloak;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
