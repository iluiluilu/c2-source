# Duoc include truoc cac server block khac (thu tu alphabet trong conf.d/).
# map nay chi set "Connection: upgrade" khi request thuc su la websocket,
# giu keep-alive binh thuong cho cac request con lai.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Toan bo traffic cong khai di qua Cloudflare proxy - neu khong khai bao cac
# dai IP nay, $remote_addr se LUON la IP edge cua Cloudflare (khong phai IP
# client that), lam sai access log VA lam "allow/deny" theo IP (vd trong
# files.conf) chan nham/cho qua nham moi nguoi. Danh sach IP Cloudflare
# (https://www.cloudflare.com/ips/) - cap nhat lai neu Cloudflare doi dai IP.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# nginx chi resolve hostname trong "proxy_pass http://ten-service:port;" MOT
# LAN duy nhat luc start/reload, roi cache IP do vinh vien - khi container
# dich (web/backend/keycloak/seaweedfs) bi recreate (vd sau "docker compose
# up -d web backend" luc deploy version moi) va doi IP noi bo, nginx VAN GOI
# VAO IP CU -> 502 "Connection refused" cho toi khi co ai nho reload nginx
# tay. Khai bao resolver (DNS noi bo cua Docker) + dung bien trong proxy_pass
# (xem cac file *.conf) de nginx tu resolve lai theo TTL, khong can reload tay.
resolver 127.0.0.11 valid=10s;
