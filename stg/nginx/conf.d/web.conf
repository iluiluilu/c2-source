# web.green0tech.site -> web (Next.js, port 3000)
server {
    listen 80;
    server_name web.green0tech.site;

    # NextAuth luu session (accessToken/idToken/roles tu Keycloak) vao cookie
    # JWT kha lon - buffer mac dinh cua nginx (4-8k) khong du, gay loi
    # "upstream sent too big header" (502) dung ngay tai callback dang nhap.
    proxy_buffer_size 16k;
    proxy_buffers 4 16k;
    proxy_busy_buffers_size 32k;

    location / {
        set $upstream_web web:3000;
        proxy_pass http://$upstream_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare luon noi origin bang HTTPS toi browser roi ha cap ve
        # HTTP toi day (Flexible mode) - khai bao https co dinh de app biet
        # request goc la https (redirect, cookie Secure, v.v.).
        proxy_set_header X-Forwarded-Proto https;

        # Next.js dung WebSocket cho HMR (dev) va co the cho vai tinh nang
        # runtime khac - giu upgrade header de khong gay loi neu can.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
