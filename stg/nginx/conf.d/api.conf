# api.green0tech.site -> backend (Spring Boot, port 3001)
server {
    listen 80;
    server_name api.green0tech.site;

    # Khop MAX_UPLOAD_BYTES=2GB cua backend (docker-compose.yml).
    client_max_body_size 2048m;

    location / {
        set $upstream_backend backend:3001;
        proxy_pass http://$upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Upload/ingest lon co the mat thoi gian - noi rong timeout mac dinh (60s).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # backend-multi-instance: `backend` co nhieu replica (Docker DNS tra ve nhieu A record, nginx round-robin).
        # Replica dang tat/chet -> thu replica khac. Mac dinh nginx KHONG retry method khong idempotent (POST...)
        # sau khi da gui request di, nen an toan cho upload chunk/complete.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
    }
}
