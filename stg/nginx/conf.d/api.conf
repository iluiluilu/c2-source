# api.green0tech.site -> backend (Spring Boot, port 3001)
server {
    listen 80;
    server_name api.green0tech.site;

    # Khop MAX_UPLOAD_BYTES=2GB cua backend (docker-compose.yml).
    client_max_body_size 2048m;

    location / {
        set $upstream_backend backend:3001;
        proxy_pass http://$upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Upload/ingest lon co the mat thoi gian - noi rong timeout mac dinh (60s).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
