# filer.green0tech.site -> seaweedfs filer UI (port 8888)
#
# CANH BAO: day la UI ADMIN toan quyen, KHONG phai read-only - duyet duoc
# TAT CA bucket (ke ca "personal", "audit-archive", ".system", khong chi
# "documents"), co nut Upload/New Folder/Delete cho moi bucket. UI nay hoan
# toan bo qua phan quyen trong s3.json (identity "external-ai" chi Read+List
# bucket "documents" o S3 API port 8333 - KHONG ap dung o day). Dung chung
# whitelist IP voi files.conf (S3) theo quyet dinh cua nguoi van hanh -
# nghia la IP he thong AI cung co full quyen admin qua UI nay, khong chi
# read-only bucket "documents" nhu qua S3 API nua.
#
# KHONG co user/password rieng - SeaweedFS filer UI khong ho tro auth built-in,
# chi dua vao IP whitelist duoi day.
server {
    listen 80;
    server_name filer.green0tech.site;

    allow 119.17.198.75;
    allow 172.18.104.104; # IP private (172.18.x.x) - khong khop traffic that, xem README.md
    allow 119.17.198.77;  # IP outbound THAT cua login node A100-Server
    allow 194.233.65.175; # server mct (IPv4)
    allow 2407:3640:2257:2146::1; # server mct (IPv6) - may nay uu tien di IPv6
    # khi dich (domain qua Cloudflare, dual-stack) co ca AAAA, khac RabbitMQ/
    # Postgres/Qdrant (IP:port IPv4 thuan, khong co lua chon IPv6) nen khong
    # gap truong hop nay - da xac nhan qua log nginx thuc te.
    allow 123.16.178.225; # IP NAT dung chung cho cac node worker SLURM (node002, node004)
    deny all;

    client_max_body_size 2048m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        set $upstream_seaweedfs_filer seaweedfs:8888;
        proxy_pass http://$upstream_seaweedfs_filer;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
