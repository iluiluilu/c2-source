# files.green0tech.site -> seaweedfs S3 gateway (port 8333), CHO HE THONG AI
# NGOAI doc file tu kho du lieu chung (bucket "documents", xem s3.json cho
# identity "external-ai" - chi Read+List, khong Admin/Write, khong dung chung
# key voi "backend").
#
# Whitelist IP: sua allow/deny ben duoi cho dung IP THAT cua he thong AI khi
# co (hien dang tam allow IP cua may dang setup de test).
server {
    listen 80;
    server_name files.green0tech.site;

    allow 2402:800:61cd:15ab:8135:b6a9:baed:31dc; # IP tam de test luc setup
    allow 119.17.198.75;
    allow 172.18.104.104; # IP private (172.18.x.x) - khong khop traffic that, xem README.md
    allow 119.17.198.77;  # IP outbound THAT cua login node A100-Server, da verify bang test ket noi thuc te
    allow 123.16.178.225; # IP NAT dung chung cho cac node worker SLURM (node002, node004), da verify thuc te
    deny all;

    # Doc file lon co the mat thoi gian - noi rong timeout mac dinh (60s).
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        set $upstream_seaweedfs seaweedfs:8333;
        proxy_pass http://$upstream_seaweedfs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
